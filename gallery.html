<head>

    <title>Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ---------- общие стили ---------- */
        body {
            margin: 0;
            background: #fafafa;
            font-family: Arial, sans-serif;
        }

        /* ---------- галерея (4:3, без рамок) ---------- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            padding: 20px 0;
        }
        .gallery-item {
            cursor: pointer;
            overflow: hidden;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }

        /* ---------- лайтбокс ---------- */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lightbox-content img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .lightbox-caption {
            margin-top: 12px;
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            background: none;
            border: none;
            transition: 0.2s;
        }
        .lightbox-close:hover {
            transform: scale(1.2);
        }
        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: #fff;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
            border: none;
            padding: 10px 16px;
            border-radius: 50%;
            transition: 0.2s;
            z-index: 10;
            user-select: none;
        }
        .lightbox-arrow:hover {
            background: rgba(255,255,255,0.2);
        }
        .lightbox-prev {
            left: 20px;
        }
        .lightbox-next {
            right: 20px;
        }
        @media (max-width: 600px) {
            .lightbox-arrow {
                font-size: 30px;
                padding: 6px 10px;
            }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }

        /* ---------- футер ---------- */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            color: #888;
        }
    </style>
</head>

            // -------------------------------------------------------------
            // 2. ПЕРЕМЕШИВАНИЕ
            // -------------------------------------------------------------
            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
            const images = shuffle(imageData);

            // -------------------------------------------------------------
            // 3. ОТРИСОВКА ГАЛЕРЕИ
            // -------------------------------------------------------------
            const container = document.getElementById('galleryContainer');
            images.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                const img = document.createElement('img');
                img.src = item.src;
                img.loading = 'lazy';
                img.alt = item.title;
                div.appendChild(img);
                container.appendChild(div);
            });

            // -------------------------------------------------------------
            // 4. ЛАЙТБОКС – ПОЛНОСТЬЮ РАБОЧИЙ
            // -------------------------------------------------------------
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImage');
            const caption = document.getElementById('lightboxCaption');
            const closeBtn = document.getElementById('lightboxClose');
            const prevBtn = document.getElementById('lightboxPrev');
            const nextBtn = document.getElementById('lightboxNext');

            let currentIndex = 0;

            function openLightbox(index) {
                if (index < 0) index = images.length - 1;
                if (index >= images.length) index = 0;
                currentIndex = index;
                const item = images[currentIndex];
                lightboxImg.src = item.src;
                caption.textContent = item.title;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }

            function prevImage() {
                openLightbox(currentIndex - 1);
            }

            function nextImage() {
                openLightbox(currentIndex + 1);
            }

            // Клик по миниатюре
            document.querySelectorAll('.gallery-item img').forEach((img, idx) => {
                img.addEventListener('click', () => {
                    openLightbox(idx);
                });
            });

            // Закрытие по крестику
            closeBtn.addEventListener('click', closeLightbox);

            // Закрытие по клику на фон (но не на само изображение)
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // Стрелки
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                prevImage();
            });
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                nextImage();
            });

            // Клавиши
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            });

            // Свайп на мобильных (базово)
            let touchStartX = 0;
            lightbox.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            lightbox.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextImage();
                    else prevImage();
                }
            }, { passive: true });

        })();
