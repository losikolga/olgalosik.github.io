       .rotating-text-circle {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 420px;
    height: 120px;

    transform: translate(-50%, -50%);

    animation: rotateSaturn 12s linear infinite;

    z-index: 20;
}

@keyframes rotateSaturn {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

        @keyframes rotateCircle {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .rotating-text-circle svg text {
            font-size: 20px;
            font-weight: bold;
            fill: #0000ff;
            letter-spacing: 3px;
        }

     /* ========================================
   macOS FOLDER LINKS
   ======================================== */

.folder-link {
    position: absolute;

    width: 80px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-decoration: none;
    cursor: pointer;

    z-index: 10;

    animation: float 6s ease-in-out infinite;

    transition: transform 0.25s ease;
}


/* ========================================
   FOLDER ICON
   ======================================== */

.folder-icon {
    width: 52px;
    height: 44px;

    display: block;

    transition:
        transform 0.25s ease,
        filter 0.25s ease;

    filter:
        drop-shadow(0 1px 2px rgba(0, 0, 0, 0.18))
        drop-shadow(0 1px 4px rgba(0, 100, 255, 0.15));
}


.folder-icon svg {
    width: 100%;
    height: 100%;

    display: block;
}


/* ========================================
   FOLDER NAME
   ======================================== */

.folder-name {
    display: block;

    margin-top: 2px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size: 13px;

    font-weight: 400;

    line-height: 16px;

    color: #1d1d1f;

    text-align: center;

    white-space: nowrap;

    text-decoration: none;

    text-shadow:
        0 1px 2px rgba(255, 255, 255, 0.8);
}


/* ========================================
   HOVER
   ======================================== */

.folder-link:hover {
    transform: scale(1.08);
}


.folder-link:hover .folder-icon {
    filter:
        drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2))
        drop-shadow(0 0 9px rgba(0, 122, 255, 0.5));
}


.folder-link:hover .folder-name {
    color: #007aff;
}

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }

        .info {

            left: 20px;
            color: #666666;
            font-size: 12px;
            z-index: 10;

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Инициализация сцены
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Создание шара (сферы)
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        
      // Загрузка фотографии
const textureLoader = new THREE.TextureLoader();

const texture = textureLoader.load('https://raw.githubusercontent.com/losikolga/olgalosik.github.io/refs/heads/main/images/home-tile.JPG');

const material = new THREE.MeshPhongMaterial({
    map: texture,
    shininess: 30
});
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

// ================================
// БЕГУЩИЙ ТЕКСТ ВОКРУГ ЭКВАТОРА
// ================================

const textRing = new THREE.Group();

const text =
    " ★ WELCOME TO MY WEB SITE ☁︎࣪ WELCOME TO MY WEB SITE";

const radius = 2.15;

const letters = [];

function createLetter(char, index) {

    const canvas = document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");

ctx.clearRect(0, 0, 128, 128);

ctx.font = "bold 54px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

// ==========================================
// ХРОМАТИЧЕСКИЙ ОРЕОЛ
// ==========================================

// Cyan — немного смещаем влево
ctx.shadowColor = "rgba(0, 255, 255, 0.8)";
ctx.shadowBlur = 12;

ctx.fillStyle = "rgba(0, 255, 255, 0.45)";
ctx.fillText(char, 60, 64);


// Magenta — немного смещаем вправо
ctx.shadowColor = "rgba(255, 0, 255, 0.8)";
ctx.shadowBlur = 12;

ctx.fillStyle = "rgba(255, 0, 255, 0.45)";
ctx.fillText(char, 68, 64);


// ==========================================
// ОСНОВНОЕ СВЕЧЕНИЕ
// ==========================================

ctx.shadowColor = "#0088ff";
ctx.shadowBlur = 20;

ctx.fillStyle = "#ffffff";

ctx.fillText(char, 64, 64);


// ==========================================
// ЯРКОЕ ЯДРО БУКВЫ
// ==========================================

ctx.shadowColor = "#eaffff";
ctx.shadowBlur = 5;

ctx.fillStyle = "#eaffff";

ctx.fillText(char, 64, 64);


// ==========================================
// СБРАСЫВАЕМ ЭФФЕКТ
// ==========================================

ctx.shadowBlur = 0;
ctx.shadowColor = "transparent";

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: true
    });

    const sprite = new THREE.Sprite(material);

    sprite.scale.set(0.32, 0.32, 1);

    sprite.userData.offset =
        -(index / text.length) * Math.PI * 2;

    textRing.add(sprite);

    letters.push(sprite);
}


// Создаем все буквы
for (let i = 0; i < text.length; i++) {
    createLetter(text[i], i);
}


// Обновление положения текста
function updateTextRing() {

    const speed = 0.005;

    textRing.userData.angle =
        (textRing.userData.angle || 0) + speed;

    // Положение орбиты
    const orbitAngle = Date.now() * 0.0003;

    letters.forEach((letter) => {

        const angle =
            letter.userData.offset +
            textRing.userData.angle;

        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;

        // Постепенно меняем высоту орбиты
        const y =
            Math.sin(angle + orbitAngle) * 0.8;

        letter.position.x = x;
        letter.position.y = y;
        letter.position.z = z;
    });
}
scene.add(textRing);

        // Освещение
        const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
        light2.position.set(-5, -5, -5);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Параметры вращения
        let rotationSpeed = 0.003;

        // Функция анимации
     function animate() {

    requestAnimationFrame(animate);

    // Вращение сферы
    sphere.rotation.x += rotationSpeed;
    sphere.rotation.y += rotationSpeed * 1.5;
    sphere.rotation.z += rotationSpeed * 0.5;

    // Движение текста вокруг экватора
    updateTextRing();

    renderer.render(scene, camera);
}

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск анимации
        animate();

        // Интерактивность
        document.addEventListener('mousemove', (event) => {
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Небольшое изменение ориентации при движении мышки
            sphere.rotation.x = y * 0.3;
            sphere.rotation.y = x * 0.3;
        });

        // Клик по шару ускоряет вращение
        canvas.addEventListener('click', () => {
            rotationSpeed = 0.02;
            setTimeout(() => {
                rotationSpeed = 0.003;
            }, 1000);
        });
    </script>
