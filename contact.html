<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact-page">
    <div class="header">
        <div class="header-nav">
            <a href="index.html">home</a>
            <a href="works.html">works</a>
            <a href="gallery.html">gallery</a>
            <a href="contact.html" class="active">contact me</a>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">CONTACT ME</h1>
        
        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <label for="email">your email adress</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">your message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">SEND MESSAGE</button>
            </form>

            <div id="successMessage" style="display: none; margin-top: 20px; color: #00aa00;">
                <p>✓ Message sent successfully! I'll get back to you soon.</p>
            </div>

            <div id="errorMessage" style="display: none; margin-top: 20px; color: #aa0000;">
                <p>✗ Error sending message. Please try again.</p>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Designed & built by Olga Losik. All rights reserved.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    // Проверка email
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        errorMessage.innerHTML = `
            <p>✗ Please enter a valid email address.</p>
        `;
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
    }

    // Проверка сообщения
    if (!message) {
        errorMessage.innerHTML = `
            <p>✗ Please enter your message.</p>
        `;
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
    }

    // Отправка формы
    try {
        const response = await fetch('https://formspree.io/f/xjyvkrza', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: email,
                message: message
            })
        });

        if (response.ok) {
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            form.reset();

            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000);

        } else {
            errorMessage.innerHTML = `
                <p>✗ Error sending message. Please try again.</p>
            `;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

    } catch (error) {
        errorMessage.innerHTML = `
            <p>✗ Error sending message. Please try again.</p>
        `;
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
    }
});

            // Используем Formspree для отправки на почту
            // Замени YOUR_EMAIL на свой адрес электронной почты
            try {
                const response = await fetch('https://formspree.io/f/YOUR_FORM_ID', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        message: message
                    })
                });

                if (response.ok) {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    form.reset();
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 5000);
                } else {
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                }
            } catch (error) {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
