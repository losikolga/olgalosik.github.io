    <!-- ФОТО-ЛАЙТБОКС -->
    <div id="lightbox" class="lightbox">
        <button id="lightboxPrev" class="lightbox-arrow lightbox-prev">‹</button>
        <img id="lightboxImage" src="" alt="">
        <button id="lightboxNext" class="lightbox-arrow lightbox-next">›</button>
    </div>

                id="lightboxVideo"
                src=""
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>

    <script>
        /* ========================================
           GALLERY
           ======================================== */
        const galleryPhotos =
            Array.from(document.querySelectorAll('.gallery-photo'));

        const lightbox =
            document.getElementById('lightbox');

        const lightboxImage =
            document.getElementById('lightboxImage');

        const prevButton =
            document.getElementById('lightboxPrev');

        const nextButton =
            document.getElementById('lightboxNext');

        let currentPhoto = 0;

        /* ========================================
           OPEN PHOTO
           ======================================== */
        function openPhoto(index) {
            currentPhoto = index;
            lightboxImage.style.transition = 'none';
            lightboxImage.style.transform = 'translateX(0)';
            lightboxImage.src = galleryPhotos[currentPhoto].src;
            lightbox.classList.add('active');
        }

        /* ========================================
           CHANGE PHOTO
           ======================================== */
        function changePhoto(direction) {
            const newImage = galleryPhotos[currentPhoto].src;

            if (direction === 'next') {
                lightboxImage.style.transform = 'translateX(-100vw)';
            } else {
                lightboxImage.style.transform = 'translateX(100vw)';
            }

            setTimeout(() => {
                lightboxImage.style.transition = 'none';
                lightboxImage.src = newImage;

                if (direction === 'next') {
                    lightboxImage.style.transform = 'translateX(100vw)';
                } else {
                    lightboxImage.style.transform = 'translateX(-100vw)';
                }

                lightboxImage.offsetHeight;
                lightboxImage.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
                lightboxImage.style.transform = 'translateX(0)';
            }, 300);
        }

        /* ========================================
           PREVIOUS PHOTO
           ======================================== */
        function showPrevious() {
            currentPhoto--;
            if (currentPhoto < 0) {
                currentPhoto = galleryPhotos.length - 1;
            }
            changePhoto('previous');
        }

        /* ========================================
           NEXT PHOTO
           ======================================== */
        function showNext() {
            currentPhoto++;
            if (currentPhoto >= galleryPhotos.length) {
                currentPhoto = 0;
            }
            changePhoto('next');
        }

        /* ========================================
           CLICK ON PHOTO
           ======================================== */
        galleryPhotos.forEach((photo, index) => {
            photo.addEventListener('click', () => {
                openPhoto(index);
            });
        });

        /* ========================================
           PHOTO ARROWS
           ======================================== */
        prevButton.addEventListener('click', (event) => {
            event.stopPropagation();
            showPrevious();
        });

        nextButton.addEventListener('click', (event) => {
            event.stopPropagation();
            showNext();
        });

        /* ========================================
           CLOSE PHOTO LIGHTBOX
           ======================================== */
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                lightbox.classList.remove('active');
                lightboxImage.src = '';
            }
        });

        /* ========================================
           VIDEO
           ======================================== */
        const videoPreview =
            document.getElementById('videoPreview');

        const videoLightbox =
            document.getElementById('videoLightbox');

        const lightboxVideo =
            document.getElementById('lightboxVideo');

        const youtubeVideoID = 'RDs-C4N0mCc';

        /* ========================================
           OPEN VIDEO
           ======================================== */
        videoPreview.addEventListener('click', () => {
            lightboxVideo.src =
                'https://www.youtube.com/embed/RDs-C4N0mCc?autoplay=1';
            videoLightbox.classList.add('active');
        });

        /* ========================================
           CLOSE VIDEO
           ======================================== */
        videoLightbox.addEventListener('click', (event) => {
            if (event.target === videoLightbox) {
                lightboxVideo.src = '';
                videoLightbox.classList.remove('active');
            }
        });

        /* ========================================
           KEYBOARD
           ======================================== */
        document.addEventListener('keydown', (event) => {
            /* ESC */
            if (event.key === 'Escape') {
                if (lightbox.classList.contains('active')) {
                    lightbox.classList.remove('active');
                    lightboxImage.src = '';
                }
                if (videoLightbox.classList.contains('active')) {
                    lightboxVideo.src = '';
                    videoLightbox.classList.remove('active');
                }
            }

            /* Стрелка влево */
            if (event.key === 'ArrowLeft' && lightbox.classList.contains('active')) {
                showPrevious();
            }

            /* Стрелка вправо */
            if (event.key === 'ArrowRight' && lightbox.classList.contains('active')) {
                showNext();
            }
        });

        /* ========================================
           TOUCH SWIPE
           ======================================== */
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (event) => {
            touchStartX = event.touches[0].clientX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (event) => {
            touchEndX = event.changedTouches[0].clientX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;

            if (swipeDistance > 50) {
                showPrevious();
            }

            if (swipeDistance < -50) {
                showNext();
            }
        }
    </script>
